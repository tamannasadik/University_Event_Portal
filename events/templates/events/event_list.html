<!DOCTYPE html>
<html>
<head>
    <title>University Events</title>
    <!-- Optional: Bootstrap CDN for better styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">

    <h1 class="mb-4">Upcoming Events</h1>

    <!-- Category Filter Form -->
    <form method="get" action="{% url 'events' %}" class="mb-4 w-auto">
      <select name="category" onchange="this.form.submit()" class="form-select">
        <option value="">All Categories</option>
        <option value="Seminar" {% if request.GET.category == 'Seminar' %}selected{% endif %}>Seminar</option>
        <option value="Workshop" {% if request.GET.category == 'Workshop' %}selected{% endif %}>Workshop</option>
        <option value="Cultural" {% if request.GET.category == 'Cultural' %}selected{% endif %}>Cultural Feast</option>
        <option value="Concert" {% if request.GET.category == 'Concert' %}selected{% endif %}>Concert</option>
      </select>
    </form>

    <!-- Events List -->
    <ul class="list-group">
        {% for event in events %}
        <li class="list-group-item mb-2">
            <a href="{% url 'event_detail' event.id %}" class="h5 text-decoration-none">{{ event.title }}</a><br>
            <small class="text-muted">{{ event.start_time|date:"F j, Y, g:i a" }}</small>
            <p>{{ event.description|truncatewords:20 }}</p>
        </li>
        {% empty %}
        <p>No events found.</p>
        {% endfor %}
    </ul>

    <!-- Optional: Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
